name: homebuy_manager
description: A professional home purchase and inventory management app.
publish_to: 'none'
version: 5.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State Management

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.4.0
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  
  # UI/Charts
  fl_chart: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  
  # Typography
  google_fonts: ^8.0.2
  firebase_core: ^3.10.0
  firebase_remote_config: ^5.2.0
  package_info_plus: ^9.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/icon-splash.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/icon/icon-splash.png
    color: "#ffffff"
  fullscreen: true
